# This workflow will build a .NET Framework project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Framework

on:
  push:
    branches: [ "Master" ]
  pull_request:
    branches: [ "Master" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET Framework
      run: choco install visualstudio2022community --params "--add Microsoft.VisualStudio.Workload.WebBuildTools"
    - name: Restore dependencies
      run: nuget restore ProjectTDM_Backend.sln
    - name: Build
      run: msbuild <YourSolutionFile>.sln /p:Configuration=Release
    - name: Test
      run: vstest.console.exe ProjectTDM_Backend.dll
